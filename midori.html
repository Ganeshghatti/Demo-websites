// Navbar Component
const Navbar = () => {
  const [isScrolled, setIsScrolled] = useState(false);

  }, []);

  return (
    <nav
      className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${

          </div>

            midori <span className="text-midori-green font-sans font-bold text-lg">Supergreens</span>
          </div>
        </a>

        {/* Desktop Nav */}

              key={item.label}
              href={item.href}

            >
              {item.label}
            </a>
          ))}

            whileHover={{ scale: 1.05 }}
            whileTap={{ scale: 0.95 }}
            className="bg-midori-green text-white px-6 py-2 rounded-full font-medium text-sm hover:bg-white hover:text-midori-purple transition-colors"
          >
            Order Now
          </motion.button>
        </div>

        {/* Mobile Toggle */}
        <button
          className="md:hidden text-white"
          onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
        >
          {isMobileMenuOpen ? <X /> : <Menu />}
        </button>
      </div>

      {/* Mobile Menu */}
      <AnimatePresence>
        {isMobileMenuOpen && (
          <motion.div
            initial={{ opacity: 0, height: 0 }}
            animate={{ opacity: 1, height: 'auto' }}
            exit={{ opacity: 0, height: 0 }}

};
