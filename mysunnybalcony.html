        { id: 1, name: "Sarah Jenkins", role: "Apartment Owner", content: "My Sunny Balcony completely transformed my tiny 4x10 space. I never thought I could have a lemon tree in the city! It's now my favorite place to have morning coffee.", image: "https://randomuser.me/api/portraits/women/44.jpg" },
        { id: 2, name: "Marcus Thorne", role: "Interior Designer", content: "As a designer, I appreciate their attention to detail. The pots they selected match my living room perfectly, creating a seamless flow from indoor to outdoor.", image: "https://randomuser.me/api/portraits/men/32.jpg" },
        { id: 3, name: "Elena Rodriguez", role: "Urban Gardener", content: "The maintenance service is a lifesaver. I travel often, and knowing my plants are being cared for by experts gives me total peace of mind.", image: "https://randomuser.me/api/portraits/women/68.jpg" }
      ];

      return (
        <section className="py-24 bg-brand-primary text-white relative overflow-hidden">
          <div className="absolute inset-0 opacity-10" style={{ backgroundImage: 'radial-gradient(#ffffff 1px, transparent 1px)', backgroundSize: '30px 30px' }}></div>
          <div className="container mx-auto px-6 relative z-10">
            <div className="text-center mb-16">
              <h2 className="font-serif text-4xl md:text-5xl mb-6">Growing Happiness</h2>
              <p className="text-brand-light/80 max-w-2xl mx-auto">Don't just take our word for it. Here is what our community of urban gardeners has to say.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {testimonials.map((t, index) => (
                <motion.div
                  key={t.id}
                  initial={{ opacity: 0, y: 30 }}
                  whileInView={{ opacity: 1, y: 0 }}
                  viewport={{ once: true }}
                  transition={{ delay: index * 0.1, duration: 0.5 }}
                  className="bg-white/10 backdrop-blur-sm p-8 rounded-2xl border border-white/10 hover:bg-white/15 transition-colors"
                >
                  <div className="flex gap-1 text-brand-accent mb-4">
                    {[...Array(5)].map((_, i) => <Star key={i} size={16} fill="currentColor" />)}

                  <p className="text-brand-light/90 italic mb-8 leading-relaxed">"{t.content}"</p>
                  <div className="flex items-center gap-4">
                    <img src={t.image} alt={t.name} className="w-12 h-12 rounded-full border-2 border-brand-accent" />
                    <div>
                      <h4 className="font-bold text-white text-sm">{t.name}</h4>
                      <p className="text-brand-light/60 text-xs">{t.role}</p>
                    </div>
                  </div>
                </motion.div>
              ))}
            </div>
          </div>
        </section>

    };

      };

      return (
        <section id="contact" className="py-24 bg-brand-light">
          <div className="container mx-auto px-6">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
              <div>
                <span className="text-brand-primary text-sm font-bold tracking-widest uppercase mb-2 block">Get in Touch</span>
                <h2 className="font-serif text-4xl md:text-5xl text-brand-dark mb-6">Let's Create Your <br/>Private Oasis</h2>

                  <div><label htmlFor="email" className="block text-sm font-medium text-gray-700 mb-2">Email</label><input type="email" id="email" required className="w-full px-4 py-3 rounded-xl bg-brand-light border-transparent focus:bg-white focus:ring-2 focus:ring-brand-primary/50 focus:outline-none transition-all" placeholder="hello@example.com" value={formState.email} onChange={(e) => setFormState({...formState, email: e.target.value})} /></div>
                  <div><label htmlFor="message" className="block text-sm font-medium text-gray-700 mb-2">How can we help?</label><textarea id="message" rows={4} required className="w-full px-4 py-3 rounded-xl bg-brand-light border-transparent focus:bg-white focus:ring-2 focus:ring-brand-primary/50 focus:outline-none transition-all resize-none" placeholder="Tell us about your space..." value={formState.message} onChange={(e) => setFormState({...formState, message: e.target.value})} ></textarea></div>
                  <button type="submit" className="w-full py-4 bg-brand-dark text-white font-medium rounded-xl hover:bg-brand-primary transition-all flex items-center justify-center gap-2 shadow-lg shadow-brand-dark/20">Send Message <Send size={16} /></button>

        </section>

    };

    // 8. Footer
    const Footer = ({ onOpenPlantCare }) => {

        <footer className="bg-brand-dark text-white/80 py-16 border-t border-white/10">
          <div className="container mx-auto px-6">
            <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
              <div className="col-span-1 md:col-span-1">
                <a href="#" className="flex items-center gap-2 mb-6 text-white"><Leaf className="w-6 h-6 text-brand-accent" /><span className="font-serif text-2xl font-bold">My Sunny Balcony</span></a>
                <p className="text-sm leading-relaxed mb-6">Transforming urban concrete into lush, green sanctuaries, one balcony at a time.</p>
                <div className="flex gap-4">
                  <a href="https://www.linkedin.com/company/mysunnybalcony/about/" className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-brand-accent hover:text-brand-dark transition-all"><Linkedin size={16} /></a>
                </div>
              </div>
              <div><h4 className="font-bold text-white mb-6">Services</h4><ul className="space-y-3 text-sm"><li><a href="#" className="hover:text-brand-accent transition-colors">Balcony Design</a></li><li><a href="#" className="hover:text-brand-accent transition-colors">Garden Installation</a></li><li><a href="#" className="hover:text-brand-accent transition-colors">Plant Maintenance</a></li><li><a href="#" className="hover:text-brand-accent transition-colors">Consultations</a></li></ul></div>
              <div><h4 className="font-bold text-white mb-6">Resources</h4><ul className="space-y-3 text-sm"><li><a href="#" className="hover:text-brand-accent transition-colors">About Us</a></li><li><a href="#" className="hover:text-brand-accent transition-colors">Our Team</a></li><li><button onClick={onOpenPlantCare} className="hover:text-brand-accent transition-colors text-left focus:outline-none">Plant Care Tips</button></li><li><a href="#" className="hover:text-brand-accent transition-colors">FAQ</a></li></ul></div>
              <div><h4 className="font-bold text-white mb-6">Newsletter</h4><p className="text-sm mb-4">Subscribe for plant care tips and design inspiration.</p><form className="flex gap-2"><input type="email" placeholder="Email address" className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:border-brand-accent" /><button className="bg-brand-accent text-brand-dark px-3 py-2 rounded-lg text-sm font-bold hover:bg-white transition-colors">OK</button></form></div>
            </div>
            <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center gap-4"><p className="text-xs text-white/40">© {new Date().getFullYear()} My Sunny Balcony. All rights reserved.</p><div className="flex gap-6 text-xs text-white/40"><a href="#" className="hover:text-white transition-colors">Privacy Policy</a><a href="#" className="hover:text-white transition-colors">Terms of Service</a></div></div>
          </div>
        </footer>
      );
    };

    // 9. PlantCareModal
    const PlantCareModal = ({ isOpen, onClose }) => {
      const tips = [
        { icon: <Droplets className="w-6 h-6 text-blue-400" />, title: "Watering Wisdom", description: "Check the soil moisture before watering. Insert your finger about an inch deep; if it feels dry, it's time to water. Overwatering is a common mistake!" },
        { icon: <Sun className="w-6 h-6 text-brand-sun" />, title: "Sunlight Secrets", description: "Observe your balcony's light patterns. Most vegetables need 6+ hours of direct sun, while many foliage plants prefer indirect, bright light." },
        { icon: <Scissors className="w-6 h-6 text-brand-accent" />, title: "Pruning for Growth", description: "Regularly remove dead leaves and spent flowers (deadheading). This encourages the plant to direct energy into new growth and blooms." },
        { icon: <Sprout className="w-6 h-6 text-brand-primary" />, title: "Feeding Your Plants", description: "Potted plants have limited nutrients. Feed them with a balanced organic fertilizer every 2-4 weeks during the growing season (spring/summer)." }

      return (
        <AnimatePresence>

              <motion.div initial={{ opacity: 0, scale: 0.95, y: 20 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: 0.95, y: 20 }} transition={{ type: "spring", duration: 0.5 }} className="fixed inset-0 z-[70] flex items-center justify-center p-4 pointer-events-none">
                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden pointer-events-auto flex flex-col max-h-[90vh]">

                    <div className="flex items-center gap-3 mb-2"><div className="p-2 bg-brand-primary text-white rounded-full"><Sprout size={24} /></div><h2 className="font-serif text-3xl font-bold text-brand-dark">Plant Care Guide</h2></div>
                    <p className="text-gray-600 ml-1">Essential tips to keep your urban oasis thriving.</p>
                  </div>
                  <div className="p-8 overflow-y-auto">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {tips.map((tip, index) => (
                        <div key={index} className="bg-brand-light/30 p-6 rounded-2xl border border-brand-light hover:border-brand-accent/30 transition-colors">
                          <div className="mb-4 bg-white w-12 h-12 rounded-full flex items-center justify-center shadow-sm">{tip.icon}</div>
                          <h3 className="font-serif text-xl font-bold text-brand-dark mb-2">{tip.title}</h3>
                          <p className="text-sm text-gray-600 leading-relaxed">{tip.description}</p>
                        </div>
                      ))}
                    </div>
                    <div className="mt-8 bg-brand-primary/5 p-6 rounded-xl border border-brand-primary/10 flex gap-4 items-start">
                       <div className="bg-brand-primary/10 p-2 rounded-full shrink-0"><Leaf className="w-5 h-5 text-brand-primary" /></div>
                       <div><h4 className="font-bold text-brand-primary mb-1 text-sm uppercase tracking-wider">Pro Tip</h4><p className="text-gray-700 italic text-sm">"The best fertilizer is the gardener's shadow. Observe your plants daily to catch issues early!"</p></div>
                    </div>
                  </div>
                </div>
              </motion.div>
            </>
          )}
        </AnimatePresence>
      );
    };

    // 10. App
    const App = () => {
      const [scrolled, setScrolled] = useState(false);
      const [isPlantCareOpen, setIsPlantCareOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="min-h-screen flex flex-col font-sans overflow-x-hidden">
          <Navbar scrolled={scrolled} />
          <main className="flex-grow">
            <Hero />
            <About />
            <Services />
            <Gallery />
            <Testimonials />
            <Contact />
          </main>
          <Footer onOpenPlantCare={() => setIsPlantCareOpen(true)} />
          <PlantCareModal isOpen={isPlantCareOpen} onClose={() => setIsPlantCareOpen(false)} />
        </div>
      );
    };

    // 11. Mount
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
